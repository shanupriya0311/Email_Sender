server:
  port: 8081

spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  webhook:
    secret: ${SUPABASE_WEBHOOK_SECRET}
  mail:
    from: ${MAIL_FROM}
    subject: ${REGISTRATION_EMAIL_SUBJECT:Internship Registration Confirmation}
    message: "${REGISTRATION_EMAIL_MESSAGE:Dear Candidate,\n\nWe are pleased to inform you that your internship registration with Valoria Technology has been successfully completed.\nThank you for your interest in joining our internship program. We have successfully received your application details.\n\nOur team will review your application and share further updates regarding the internship process through your registered email address.\nWe appreciate your interest in Valoria Technology and look forward to having you as part of our learning community.\n\nBest Regards,\nHR Team\nValoria Technology\nhr@valoriatech.page\nhttps://valoriatech.page}"
